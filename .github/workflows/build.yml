name: build

on:
  push:
    branches: [master, cpu-optimization, anari-device, gpu-backend]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  ANARI_SDK_REF: v0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: tachyon
          - os: macos-latest
            name: macos-arm64
            exe: tachyon
          - os: windows-latest
            name: windows-x86_64
            exe: tachyon.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        run: sh build_win/build.sh

      - name: Smoke test
        run: |
          build_win/bin/${{ matrix.exe }} scenes/teapot.dat -res 256 256 -format PPM -o teapot.ppm
          test -s teapot.ppm

      - name: Package
        run: |
          mkdir -p dist/tachyon-${{ matrix.name }}
          cp build_win/bin/${{ matrix.exe }} README.md LICENSE dist/tachyon-${{ matrix.name }}/
          cd dist && tar czf tachyon-${{ matrix.name }}.tar.gz tachyon-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-${{ matrix.name }}
          path: dist/tachyon-${{ matrix.name }}.tar.gz

  anari:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install Ninja
        if: matrix.os != 'windows-latest'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y ninja-build
            else
              brew install ninja
            fi
          fi

      - name: Resolve paths
        run: |
          # cygpath -m gives C:/... form for native Windows tools under MSYS2.
          ROOT=$(cygpath -m "$PWD" 2>/dev/null || pwd)
          echo "TACHYON_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANARI_PREFIX=$ROOT/deps/anari-sdk/install" >> "$GITHUB_ENV"

      - name: Restore ANARI-SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: deps/anari-sdk/install
          key: anari-sdk-${{ env.ANARI_SDK_REF }}-${{ matrix.os }}-v2

      - name: Fetch ANARI-SDK source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/ANARI-SDK
          ref: ${{ env.ANARI_SDK_REF }}
          path: deps/anari-sdk/src
          fetch-depth: 1

      - name: Build and install ANARI-SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # SDK 0.16.0 bug: the palette variable lacks its export macro, so the
          # CTS tools fail to link against the test-scenes DLL on Windows.
          hdr=deps/anari-sdk/src/src/anari_test_scenes/generators/ColorPalette.h
          sed -i.bak 's/^extern const std::vector<anari::math::float3> palette;/ANARI_TEST_SCENES_INTERFACE extern const std::vector<anari::math::float3> palette;/' "$hdr"
          grep -q '^ANARI_TEST_SCENES_INTERFACE extern' "$hdr"
          cmake -S deps/anari-sdk/src -B deps/anari-sdk/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ANARI_PREFIX" \
            -DBUILD_TESTING=ON \
            -DBUILD_HELIDE_DEVICE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CTS=OFF \
            -DBUILD_VIEWER=OFF
          cmake --build deps/anari-sdk/build --parallel
          cmake --install deps/anari-sdk/build

      - name: Build tachyon ANARI device
        run: |
          args=(-S . -B build -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DTACHYON_BUILD_ANARI=ON
            "-DCMAKE_PREFIX_PATH=$ANARI_PREFIX")
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Keep the DLL free of MinGW runtime dependencies so MSVC hosts can load it.
            args+=("-DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++")
          fi
          cmake "${args[@]}"
          cmake --build build --parallel

      - name: Smoke test (anariRenderTests)
        run: |
          # Use POSIX-form directories: bash cannot resolve mixed D:/ PATH entries under MSYS2.
          sdk_bin="$(cd "$ANARI_PREFIX/bin" && pwd)"
          sdk_lib="$(cd "$ANARI_PREFIX" && pwd)/lib"
          dev_dir="$(cd build/anari && pwd)"
          export PATH="$sdk_bin:$dev_dir:$PATH"
          export LD_LIBRARY_PATH="$sdk_lib:$dev_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$sdk_lib:$dev_dir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          mkdir -p render-out
          cd render-out
          if ! anariRenderTests --library tachyon > render.log 2>&1; then
            cat render.log
            echo "::error::anariRenderTests exited with a non-zero status"
            exit 1
          fi
          cat render.log
          if grep -q "failed to load" render.log; then
            echo "::error::tachyon ANARI library did not load"
            exit 1
          fi
          count=$(ls *.png 2>/dev/null | wc -l)
          echo "PNG files written: $count"
          test "$count" -ge 1

      - name: Package
        run: |
          lib=$(find build/anari -maxdepth 1 -type f \( -name 'libanari_library_tachyon.so' -o -name 'libanari_library_tachyon.dylib' -o -name 'anari_library_tachyon.dll' \) | head -n 1)
          test -n "$lib"
          pkg=tachyon-anari-${{ matrix.name }}
          mkdir -p dist/$pkg
          cp "$lib" README.md LICENSE dist/$pkg/
          cd dist && tar czf $pkg.tar.gz $pkg

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-anari-${{ matrix.name }}
          path: dist/tachyon-anari-${{ matrix.name }}.tar.gz

  shaders:
    runs-on: macos-latest
    env:
      SLANG_VERSION: "2026.20"
    steps:
      - uses: actions/checkout@v4

      - name: Restore Slang cache
        id: slang-cache
        uses: actions/cache@v4
        with:
          path: deps/slang
          key: slang-${{ env.SLANG_VERSION }}-macos-aarch64

      - name: Fetch Slang
        if: steps.slang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps/slang
          curl -fsSL -o slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz"
          tar -xzf slang.tar.gz -C deps/slang
          rm -f slang.tar.gz
          chmod +x deps/slang/bin/slangc

      - name: Compile raytrace.slang to SPIR-V and compare with committed header
        run: |
          slangc="$PWD/deps/slang/bin/slangc"
          "$slangc" -v
          mkdir -p shader-out
          "$slangc" anari/gpu/shaders/raytrace.slang \
            -target spirv -profile spirv_1_4 -capability spvRayQueryKHR \
            -entry genAabbs -stage compute -entry main -stage compute \
            -o shader-out/raytrace.spv
          cmake -DINPUT=shader-out/raytrace.spv -DOUTPUT=shader-out/raytrace.spv.h \
            -DNAME=kRaytraceSpv -P anari/gpu/embed_spirv.cmake
          # The committed header was written on Windows (CRLF); normalize before comparing.
          tr -d '\r' < anari/gpu/shaders/raytrace.spv.h > shader-out/committed.h
          if cmp -s shader-out/committed.h shader-out/raytrace.spv.h; then
            echo "SPIR-V header matches the committed raytrace.spv.h"
          else
            echo "::notice::Generated SPIR-V header differs from the committed raytrace.spv.h"
            diff shader-out/committed.h shader-out/raytrace.spv.h | head -n 40 || true
          fi

      - name: Compile raytrace.slang to Metal
        run: |
          slangc="$PWD/deps/slang/bin/slangc"
          "$slangc" anari/gpu/shaders/raytrace.slang \
            -target metal -entry genAabbs -stage compute -entry main -stage compute \
            -o shader-out/raytrace.metal
          wc -l shader-out/raytrace.metal

      - name: Compile Metal source with Apple's compiler
        run: |
          xcrun -sdk macosx metal -std=metal3.1 -c shader-out/raytrace.metal -o shader-out/raytrace.air
          xcrun -sdk macosx metallib shader-out/raytrace.air -o shader-out/raytrace.metallib

      - name: Upload Metal source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raytrace-metal-source
          path: shader-out/raytrace.metal
          if-no-files-found: warn

  vulkan-sw:
    strategy:
      fail-fast: false
      matrix:
        include:
          # as-is: the backend as committed (expected to fall back to the CPU
          # on lavapipe, which exposes a single memory type for readback).
          - patch: false
            name: as-is
          # CI-only experiment: adds a host-visible fallback to the Readback
          # memory choice in anari/gpu/VulkanContext.cpp (not committed).
          - patch: true
            name: readback-fallback
    name: vulkan-sw (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan tools and Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools ninja-build

      - name: CI-only patch of the Readback memory fallback
        if: matrix.patch
        run: |
          python3 - <<'PYEOF'
          p = "anari/gpu/VulkanContext.cpp"
          s = open(p, encoding="utf-8", newline="").read()
          old = "      type = findMemoryType(req.memoryTypeBits, hv, dl);\r\n    break;"
          if old not in s:
              old = "      type = findMemoryType(req.memoryTypeBits, hv, dl);\n    break;"
          nl = "\r\n" if "\r\n" in old else "\n"
          assert s.count(old) == 1, s.count(old)
          new = old.replace("    break;", "    if (type == ~0u)" + nl + "      type = findMemoryType(req.memoryTypeBits, hv, 0);" + nl + "    break;")
          open(p, "w", encoding="utf-8", newline="").write(s.replace(old, new))
          print("patched", p)
          PYEOF
          grep -n -A3 "findMemoryType(req.memoryTypeBits, hv, dl)" anari/gpu/VulkanContext.cpp

      - name: Check lavapipe for VK_KHR_ray_query
        id: rt
        run: |
          echo "mesa-vulkan-drivers: $(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)"
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1 || true)
          echo "lavapipe ICD: ${icd:-none}"
          if [ -n "$icd" ]; then export VK_ICD_FILENAMES="$icd"; fi
          vulkaninfo > vk-full.txt 2>&1 || true
          grep -E "deviceName|driverInfo" vk-full.txt | head -n 4 || true
          grep -E "VK_KHR_ray_query|VK_KHR_acceleration_structure" vk-full.txt || true
          echo "--- lavapipe memory properties"
          grep -n -E "memory(Types|Heaps)|propertyFlags|heapIndex|heapFlags" vk-full.txt | head -n 80 || true
          found=0
          if grep -q "VK_KHR_ray_query" vk-full.txt && grep -q "VK_KHR_acceleration_structure" vk-full.txt; then found=1; fi
          vulkaninfo --summary || true
          if [ "$found" = 1 ]; then
            echo "lavapipe provides VK_KHR_ray_query and VK_KHR_acceleration_structure"
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          else
            echo "::notice::no lavapipe with VK_KHR_ray_query found; skipping the Vulkan backend test"
          fi
          echo "available=$([ "$found" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Resolve paths
        if: steps.rt.outputs.available == 'true'
        run: |
          ROOT=$(cygpath -m "$PWD" 2>/dev/null || pwd)
          echo "TACHYON_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANARI_PREFIX=$ROOT/deps/anari-sdk/install" >> "$GITHUB_ENV"

      - name: Restore ANARI-SDK cache
        if: steps.rt.outputs.available == 'true'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: deps/anari-sdk/install
          key: anari-sdk-${{ env.ANARI_SDK_REF }}-ubuntu-24.04-v2

      - name: Fetch ANARI-SDK source
        if: steps.rt.outputs.available == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/ANARI-SDK
          ref: ${{ env.ANARI_SDK_REF }}
          path: deps/anari-sdk/src
          fetch-depth: 1

      - name: Build and install ANARI-SDK
        if: steps.rt.outputs.available == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # SDK 0.16.0 bug: the palette variable lacks its export macro, so the
          # CTS tools fail to link against the test-scenes DLL on Windows.
          hdr=deps/anari-sdk/src/src/anari_test_scenes/generators/ColorPalette.h
          sed -i.bak 's/^extern const std::vector<anari::math::float3> palette;/ANARI_TEST_SCENES_INTERFACE extern const std::vector<anari::math::float3> palette;/' "$hdr"
          grep -q '^ANARI_TEST_SCENES_INTERFACE extern' "$hdr"
          cmake -S deps/anari-sdk/src -B deps/anari-sdk/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ANARI_PREFIX" \
            -DBUILD_TESTING=ON \
            -DBUILD_HELIDE_DEVICE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CTS=OFF \
            -DBUILD_VIEWER=OFF
          cmake --build deps/anari-sdk/build --parallel
          cmake --install deps/anari-sdk/build

      - name: Build tachyon ANARI device
        if: steps.rt.outputs.available == 'true'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTACHYON_BUILD_ANARI=ON \
            "-DCMAKE_PREFIX_PATH=$ANARI_PREFIX"
          cmake --build build --parallel

      - name: Render test on lavapipe (Vulkan backend)
        if: steps.rt.outputs.available == 'true'
        run: |
          sdk_bin="$(cd "$ANARI_PREFIX/bin" && pwd)"
          sdk_lib="$(cd "$ANARI_PREFIX" && pwd)/lib"
          dev_dir="$(cd build/anari && pwd)"
          export PATH="$sdk_bin:$dev_dir:$PATH"
          export LD_LIBRARY_PATH="$sdk_lib:$dev_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TACHYON_BACKEND=vulkan
          export TACHYON_VULKAN_DEBUG=1
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          mkdir -p render-out
          cd render-out
          start=$(date +%s)
          status=0
          anariRenderTests --library tachyon > render.log 2>&1 || status=$?
          echo "anariRenderTests exit status $status after $(( $(date +%s) - start )) s"
          cat render.log
          vk=$(grep -c -F "[tachyon vulkan]" render.log || true)
          cpu=$(grep -c -E "falling back to the CPU|Vulkan backend unavailable|not using the GPU backend" render.log || true)
          count=$(find . -maxdepth 1 -name '*.png' | wc -l)
          echo "Vulkan debug lines: $vk; CPU fallback messages: $cpu; PNG files written: $count"
          if [ "$status" -ne 0 ]; then
            echo "::error::anariRenderTests exited with status $status"
            exit 1
          fi
          if [ "$vk" -eq 0 ] || [ "$cpu" -ne 0 ]; then
            echo "::error::the Vulkan backend was not used (no Vulkan log lines, or CPU fallback)"
            exit 1
          fi
          test "$count" -ge 1

      - name: Upload lavapipe render output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-sw-${{ matrix.name }}-render
          path: render-out/
          if-no-files-found: ignore

  metal-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Host and display info
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          sw_vers || true
          echo "cpu: $(sysctl -n machdep.cpu.brand_string || echo unknown)"
          system_profiler SPDisplaysDataType || true

      - name: Metal capability probe
        run: |
          if ! swiftc -O .github/probe/metal_probe.swift -o metal_probe; then
            echo "::warning::metal_probe.swift failed to compile"
            exit 0
          fi
          ./metal_probe || echo "::warning::metal_probe exited with status $?"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, anari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file - <<'EOF'
          Fork of John Stone's Tachyon 0.99b6, now also available as a Khronos ANARI rendering device.

          New in this release:
          - ANARI device: now advertises KHR_MATERIAL_PHYSICALLY_BASED (the extension name was misspelled, so it was never reported).
          - ANARI device: image1D/2D/3D, transform and primitive samplers (per-hit on triangles, per-primitive on spheres and cylinders); instance bounds now use the transformed group bounding box. In eye-light mode all 148 runnable ANARI CTS cases pass against a reference with two helide fixes (cylinder caps, sampler offsets); against stock helide references 140 pass, the 8 failures being those helide bugs.
          - ANARI device: images were offset by one pixel (pixels were sampled at their corner, not their center); fixed.
          - ANARI device: renderer parameter `mode` = `eyeLight` adds a fast preview mode that ignores scene lights. With it, 91 of 97 runnable ANARI conformance (CTS) cases pass; the other 6 are 4 cylinder-cap cases where the reference device ignores `caps`, 1 bounds-dependent framing case, and 1 sampler case (samplers are not supported yet).
          - ANARI device: sphere and cylinder geometry. Large sphere sets are stored compactly with their own BVH; on a 1M-sphere scene the first frame takes about 0.16 s using 79 MB, comparable in time to the SDK's Embree-based reference device and with less memory.
          - ANARI device: material color, opacity, metallic and roughness can be driven by attributes. Opacity from per-vertex data is applied per triangle, not interpolated.
          - Experimental ANARI device (`tachyon-anari-*` archives): triangles, spheres and cylinders, perspective and orthographic cameras, matte and approximate physically based materials, directional and point lights, color and depth output. It is a small CPU-only library that needs only the ANARI SDK 0.16 loader. Other geometry types are skipped with a warning.
          - Windows: PPM/TGA image textures and volume data were read in text mode, which truncated them. Scenes using them now render correctly and identically on every run. Texture lookups no longer read outside the image.

          From the previous release: Windows (MinGW) builds use all cores by default; rendering is about 1.3–1.4x faster on AO and lattice test scenes; scene parsing is about 7–10x faster on large triangle meshes.

          Command-line binaries have no JPEG/PNG output (PPM/TGA/BMP/PSD/RGB are supported). The macOS builds are ARM64.
          EOF
