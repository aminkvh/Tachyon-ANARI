name: build

on:
  push:
    branches: [master, cpu-optimization]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: tachyon
          - os: macos-latest
            name: macos-arm64
            exe: tachyon
          - os: windows-latest
            name: windows-x86_64
            exe: tachyon.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        run: sh build_win/build.sh

      - name: Smoke test
        run: |
          build_win/bin/${{ matrix.exe }} scenes/teapot.dat -res 256 256 -format PPM -o teapot.ppm
          test -s teapot.ppm

      - name: Package
        run: |
          mkdir -p dist/tachyon-${{ matrix.name }}
          cp build_win/bin/${{ matrix.exe }} README.md LICENSE dist/tachyon-${{ matrix.name }}/
          cd dist && tar czf tachyon-${{ matrix.name }}.tar.gz tachyon-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-${{ matrix.name }}
          path: dist/tachyon-${{ matrix.name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file - <<'EOF'
          Performance-focused fork of John Stone's Tachyon 0.99b6.

          - Windows (MinGW) builds now use all cores by default instead of a single thread.
          - Rendering: about 1.3–1.4x faster on AO and lattice test scenes at the same thread count; little change on sphere-heavy molecular scenes.
          - Scene parsing: about 7–10x faster on large triangle meshes.
          - Opt-in: `-accel bvh`, `-adaptive` (experimental and lossy), `-aosamples N`.

          Output is byte-identical to stock on the test scenes, except ambient-occlusion scenes, whose noise pattern differs because of the new sampler.
          Binaries are command-line only, with no JPEG/PNG output (PPM/TGA/BMP/PSD/RGB are supported). The macOS build is ARM64.
          EOF
