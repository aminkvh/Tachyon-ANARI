name: build

on:
  push:
    branches: [master, cpu-optimization, anari-device]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  ANARI_SDK_REF: v0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: tachyon
          - os: macos-latest
            name: macos-arm64
            exe: tachyon
          - os: windows-latest
            name: windows-x86_64
            exe: tachyon.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        run: sh build_win/build.sh

      - name: Smoke test
        run: |
          build_win/bin/${{ matrix.exe }} scenes/teapot.dat -res 256 256 -format PPM -o teapot.ppm
          test -s teapot.ppm

      - name: Package
        run: |
          mkdir -p dist/tachyon-${{ matrix.name }}
          cp build_win/bin/${{ matrix.exe }} README.md LICENSE dist/tachyon-${{ matrix.name }}/
          cd dist && tar czf tachyon-${{ matrix.name }}.tar.gz tachyon-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-${{ matrix.name }}
          path: dist/tachyon-${{ matrix.name }}.tar.gz

  anari:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install Ninja
        if: matrix.os != 'windows-latest'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y ninja-build
            else
              brew install ninja
            fi
          fi

      - name: Resolve paths
        run: |
          # cygpath -m gives C:/... form for native Windows tools under MSYS2.
          ROOT=$(cygpath -m "$PWD" 2>/dev/null || pwd)
          echo "TACHYON_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANARI_PREFIX=$ROOT/deps/anari-sdk/install" >> "$GITHUB_ENV"

      - name: Restore ANARI-SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: deps/anari-sdk/install
          key: anari-sdk-${{ env.ANARI_SDK_REF }}-${{ matrix.os }}-v1

      - name: Fetch ANARI-SDK source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/ANARI-SDK
          ref: ${{ env.ANARI_SDK_REF }}
          path: deps/anari-sdk/src
          fetch-depth: 1

      - name: Build and install ANARI-SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S deps/anari-sdk/src -B deps/anari-sdk/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ANARI_PREFIX" \
            -DBUILD_TESTING=ON \
            -DBUILD_HELIDE_DEVICE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_CTS=OFF \
            -DBUILD_VIEWER=OFF
          # Keep going past failures so every other target is still built.
          set +e
          cmake --build deps/anari-sdk/build --parallel -- -k 0 > sdk-build.log 2>&1
          set -e
          # On Windows/MinGW the SDK's CTS test executables (anariCts,
          # anariCatalogTests) fail to link (undefined
          # anari::scenes::colors::palette in anari_cts_core). Neither is needed
          # by the device or anariRenderTests, and neither is installed, so
          # tolerate only those two targets on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then
            failed=$(grep '^FAILED:' sdk-build.log | grep -v -E 'anariCts|anariCatalogTests' || true)
          else
            failed=$(grep '^FAILED:' sdk-build.log || true)
          fi
          if [ -n "$failed" ]; then
            tail -n 80 sdk-build.log
            echo "$failed"
            exit 1
          fi
          cmake --install deps/anari-sdk/build

      - name: Build tachyon ANARI device
        run: |
          args=(-S . -B build -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DTACHYON_BUILD_ANARI=ON
            "-DCMAKE_PREFIX_PATH=$ANARI_PREFIX")
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Keep the DLL free of MinGW runtime dependencies so MSVC hosts can load it.
            args+=("-DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++")
          fi
          cmake "${args[@]}"
          cmake --build build --parallel

      - name: Smoke test (anariRenderTests)
        run: |
          # Use POSIX-form directories: bash cannot resolve mixed D:/ PATH entries under MSYS2.
          sdk_bin="$(cd "$ANARI_PREFIX/bin" && pwd)"
          sdk_lib="$(cd "$ANARI_PREFIX" && pwd)/lib"
          dev_dir="$(cd build/anari && pwd)"
          export PATH="$sdk_bin:$dev_dir:$PATH"
          export LD_LIBRARY_PATH="$sdk_lib:$dev_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$sdk_lib:$dev_dir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          mkdir -p render-out
          cd render-out
          if ! anariRenderTests --library tachyon > render.log 2>&1; then
            cat render.log
            echo "::error::anariRenderTests exited with a non-zero status"
            exit 1
          fi
          cat render.log
          if grep -q "failed to load" render.log; then
            echo "::error::tachyon ANARI library did not load"
            exit 1
          fi
          count=$(ls *.png 2>/dev/null | wc -l)
          echo "PNG files written: $count"
          test "$count" -ge 1

      - name: Package
        run: |
          lib=$(find build/anari -maxdepth 1 -type f \( -name 'libanari_library_tachyon.so' -o -name 'libanari_library_tachyon.dylib' -o -name 'anari_library_tachyon.dll' \) | head -n 1)
          test -n "$lib"
          pkg=tachyon-anari-${{ matrix.name }}
          mkdir -p dist/$pkg
          cp "$lib" README.md LICENSE dist/$pkg/
          cd dist && tar czf $pkg.tar.gz $pkg

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-anari-${{ matrix.name }}
          path: dist/tachyon-anari-${{ matrix.name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, anari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file - <<'EOF'
          Fork of John Stone's Tachyon 0.99b6, now also available as a Khronos ANARI rendering device.

          New in this release:
          - Experimental ANARI device (`tachyon-anari-*` archives). It renders triangle meshes with perspective and orthographic cameras, matte and approximate physically based materials, directional and point lights, and color and depth output. It is a small CPU-only library that needs only the ANARI SDK 0.16 loader. Other geometry types are skipped with a warning.
          - Windows: binary image textures (PPM/TGA) and volume data were read in text mode, which truncated them and left uninitialized memory. Scenes using them now render correctly and identically on every run.
          - Texture lookups no longer read outside the image.
          - CMake build (`-DTACHYON_BUILD_ANARI=ON` for the device).

          From the previous release: Windows (MinGW) builds use all cores by default; rendering is about 1.3–1.4x faster on AO and lattice test scenes; scene parsing is about 7–10x faster on large triangle meshes.

          Command-line binaries have no JPEG/PNG output (PPM/TGA/BMP/PSD/RGB are supported). The macOS builds are ARM64.
          EOF
